[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 requires Node >= 22.12. Node 20 fails the build immediately.
  NODE_VERSION = "22"

# Hashed Astro build assets — safe to cache forever
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static images — long cache; bump filename or purge on change
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/hero/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/product3d/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/blog-assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/about/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/story/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/OEM logos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Favicons / app icons
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/browser.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Dead URL from the pre-Astro beta-signup era. It was the sole "Not found (404)"
# in Search Console (last crawled Feb 2026, no such page exists in this repo).
# Point it at the closest current intent instead of leaving it dead.
[[redirects]]
  from = "/beta"
  to = "/book-demo/"
  status = 301

[[redirects]]
  from = "/beta/*"
  to = "/book-demo/"
  status = 301

# robots.txt advertises /sitemap-index.xml, but crawlers and SEO tools probe the
# conventional /sitemap.xml first, which 404s.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

# Rebrand cutover 2026-07-30: every legacy domain 301s straight to tenthgear.ai
# (single hop — getro.bot no longer chains through ro-bot.io).
[[redirects]]
  from = "https://ro-bot.io/*"
  to = "https://tenthgear.ai/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://ro-bot.io/*"
  to = "https://tenthgear.ai/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.ro-bot.io/*"
  to = "https://tenthgear.ai/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.ro-bot.io/*"
  to = "https://tenthgear.ai/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://getro.bot/*"
  to = "https://tenthgear.ai/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://getro.bot/*"
  to = "https://tenthgear.ai/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.getro.bot/*"
  to = "https://tenthgear.ai/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.getro.bot/*"
  to = "https://tenthgear.ai/:splat"
  status = 301
  force = true
