[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Hashed Astro build assets — safe to cache forever
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static images — long cache; bump filename or purge on change
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/hero/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/product3d/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/blog-assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/about/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/story/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/OEM logos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Favicons / app icons
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/browser.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[redirects]]
  from = "https://getro.bot/*"
  to = "https://ro-bot.io/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://getro.bot/*"
  to = "https://ro-bot.io/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.getro.bot/*"
  to = "https://ro-bot.io/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.getro.bot/*"
  to = "https://ro-bot.io/:splat"
  status = 301
  force = true
